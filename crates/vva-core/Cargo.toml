[package]
name = "vva-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/jerrita/vva"

[features]
default = []
response = ["dep:reqwest", "dep:tokio-tungstenite", "dep:sha2", "dep:futures"]
anthropic = ["dep:reqwest", "dep:futures"]
gemini = ["dep:reqwest", "dep:futures"]
filesystem-tools = ["dep:base64", "dep:glob", "dep:regex", "dep:sha2", "dep:tempfile"]
shell-tools = ["dep:tempfile"]
web-tools = ["anthropic", "gemini", "dep:dom_smoothie", "dep:htmd", "dep:futures"]
jsonl = []

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
async-trait = "0.1"
thiserror = "2.0"
http = "1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "stream", "charset", "http2", "rustls-tls-native-roots"] }
futures = { version = "0.3", optional = true }
tracing = "0.1"
base64 = { version = "0.22", optional = true }
glob = { version = "0.3", optional = true }
regex = { version = "1.11", optional = true }
sha2 = { version = "0.11", optional = true }
tempfile = { version = "3", optional = true }
dom_smoothie = { version = "0.18", optional = true }
htmd = { version = "0.5", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "native-tls"], optional = true }

[target.riscv64gc-unknown-linux-gnu.dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["native-tls-vendored"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tokio = { version = "1.40", features = ["test-util"] }
