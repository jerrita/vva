[package]
name = "vva"
version = "1.6.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/jerrita/vva"

[dependencies]
base64 = "0.22"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
async-trait = "0.1"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "rustls-tls-native-roots"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
rust-embed = { version = "8", features = ["compression", "include-exclude"] }
mime_guess = "2"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
pulldown-cmark = "0.13"
unicode-width = "0.2"
glob = "0.3"
regex = "1.11"
sha2 = "0.11"
tempfile = "3"
dom_smoothie = "0.18"
htmd = "0.5"
ignore = "0.4.33"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.4"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[profile.dev]
debug = 1

[profile.release]
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[dev-dependencies]
tokio = { version = "1.40", features = ["test-util"] }
