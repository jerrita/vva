# aarch64 交叉编译配置 (cargo build --release --target aarch64-unknown-linux-gnu)
# Fedora 交叉 gcc 包不提供共享 libgcc_s，用 .cargo/aarch64/libgcc_s.so 链接脚本
# 指向静态 libgcc.a；vendored OpenSSL 需要 CC/AR 指向交叉工具链。

[env]
CC_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-gcc"
AR_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-ar"
# Termux 原生构建使用 PATH 中的 LLVM；交叉编译时通过环境变量指定 NDK 工具链。
CC_aarch64_linux_android = "clang"
AR_aarch64_linux_android = "llvm-ar"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-L", "native=.cargo/aarch64"]

[target.aarch64-linux-android]
linker = "clang"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
